name: Auto Test

on:
  workflow_dispatch:
    inputs:
      app_branch:
        description: "Branch of the app repo to test"
        required: false
        default: "frontend/team"  # TODO to update to main or develop when ready
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout QA repo
        uses: actions/checkout@v4

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: Francis-Rai/team-tesk-manager
          ref: ${{ github.event.inputs.app_branch || 'frontend/team' }}
          path: app

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r qa/requirements.txt

      # Install Allure CLI
      - name: Install Allure
        run: |
          npm install -g allure
          allure --version

      # Start docker environment
      - name: Start containers
        working-directory: app
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          docker compose up -d --build

      # Wait for backend to be ready
      - name: Wait for backend
        id: backend_check
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)

            if [ "$STATUS" != "000" ]; then
              echo "Backend responding with HTTP $STATUS"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo "Backend never became ready"
          docker compose logs
          exit 1

      # Checkout gh-pages branch to get previous history
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # Copy history if exists
      - name: Restore Allure history
        run: |
          if [ -d "gh-pages/test-history" ]; then
            mkdir -p test-history
            cp -r gh-pages/test-history/* test-history
          fi

      - name: Run tests and generate report
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: python qa/app.py --test-types api bdd

      - name: Run Allure Action
        if: always() && steps.backend_check.outcome == 'success'
        uses: allure-framework/allure-action@v0
        with:
          # Path to the generated report directory
          # By default, it's set to `./allure-report`
          report-directory: "./allure-report"
          # GitHub Token that's used for posting the comments in Pull Requests
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Deploy report to gh-pages
      - name: Deploy report
        if: always() && steps.backend_check.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Deploy history
        if: always() && steps.backend_check.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: test-history
          destination_dir: test-history


      - name: Stop containers
        if: always()
        run: docker compose down
